<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAPP — 성형 시뮬레이터</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 40px 20px; background: #FBF5F2;
    color: #4A3B3E; line-height: 1.7;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", sans-serif;
    word-break: keep-all;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 44px 36px; max-width: 480px;
    width: 100%; text-align: center; box-shadow: 0 6px 24px rgba(217, 106, 139, .1);
  }
  .logo {
    font-size: 46px; font-weight: 900; font-style: italic; letter-spacing: 1px;
    background: linear-gradient(90deg, #D96A8B, #F0975E);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 19px; margin: 6px 0 14px; font-weight: 600; }
  p { color: #8B7A7E; font-size: 15px; margin: 0 0 26px; }
  .links { display: flex; flex-direction: column; gap: 10px; }
  a.btn {
    display: block; padding: 14px 18px; border-radius: 999px; text-decoration: none;
    font-weight: 600; font-size: 15px; color: #D96A8B; border: 1px solid #F0D9E1;
    transition: background .15s;
  }
  a.btn:hover { background: #FDF3F6; }
  a.btn.primary {
    color: #fff; border: none;
    background: linear-gradient(135deg, #D96A8B, #F0975E);
  }
  footer { margin-top: 26px; font-size: 13px; color: #A99A9E; }
  footer a { color: #A99A9E; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">YAPP<span style="font-size:20px;vertical-align:super">✦</span></div>
    <h1>성형 시뮬레이터</h1>
    <p>
      사진 한 장으로 시술 후 모습을 미리 보는 앱입니다.<br>
      모든 시뮬레이션은 기기 안에서 처리됩니다.
    </p>
    <div class="links">
      <a class="btn primary" href="https://cafe.naver.com/yappapp">커뮤니티 카페</a>
      <a class="btn" href="./privacy/">개인정보 처리방침</a>
    </div>
    <footer>문의 <a href="mailto:contact@nfiction.kr">contact@nfiction.kr</a></footer>
  </div>
</body>
</html>
